[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextvault"
version = "0.2.0"
description = "Official Python SDK for ContextVault"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["requests>=2.20,<3"]

[project.urls]
Homepage = "https://github.com/contextvault/contextvault-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextvault*"]
exclude = ["src*"]
